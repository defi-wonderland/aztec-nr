name: Tests

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  noir-tests:
    name: Noir Tests
    runs-on: ubuntu-latest-m
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Aztec environment
        uses: defi-wonderland/aztec-ci-actions/actions/setup-aztec@v0
        with:
          start-pxe: "false"
          run-compile: "false"
          run-codegen: "false"

      - name: Compile test contracts
        run: |
          aztec compile --package composition_multi_contract
          aztec compile --package composition_transitive_contract
          aztec compile --package composition_host_contract
          aztec compile --package composition_override_contract
          aztec compile --package composition_diamond_transitive_contract

      - name: Run Noir tests (multi)
        uses: defi-wonderland/aztec-ci-actions/actions/noir-tests@v0
        with:
          working-directory: composition_tests/multi

      - name: Run Noir tests (transitive)
        uses: defi-wonderland/aztec-ci-actions/actions/noir-tests@v0
        with:
          working-directory: composition_tests/transitive

      - name: Run Noir tests (host)
        uses: defi-wonderland/aztec-ci-actions/actions/noir-tests@v0
        with:
          working-directory: composition_tests/host

      - name: Run Noir tests (override)
        uses: defi-wonderland/aztec-ci-actions/actions/noir-tests@v0
        with:
          working-directory: composition_tests/override

      - name: Run Noir tests (diamond_transitive)
        uses: defi-wonderland/aztec-ci-actions/actions/noir-tests@v0
        with:
          working-directory: composition_tests/diamond_transitive

  compilation-failure-tests:
    name: Compilation Failure Tests
    runs-on: ubuntu-latest-m
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Aztec environment
        uses: defi-wonderland/aztec-ci-actions/actions/setup-aztec@v0
        with:
          start-pxe: "false"
          run-compile: "false"
          run-codegen: "false"

      - name: Run macro compilation failure tests
        run: ./macro_compilation_failure_tests/assert_macro_compilation_failure.sh
        env:
          NARGO: nargo

      - name: Run composition compilation failure tests
        run: ./composition_failure_tests/assert_composition_failure.sh
        env:
          NARGO: nargo
