name: Tests

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  noir-tests:
    name: Noir Tests
    runs-on: ubuntu-latest-m
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Aztec environment
        uses: defi-wonderland/aztec-ci-actions/actions/setup-aztec@v0
        with:
          start-pxe: "false"
          run-compile: "false"
          run-codegen: "false"

      - name: Run Noir tests
        run: |
          for pkg in composition_multi_contract composition_transitive_contract composition_host_contract composition_override_contract composition_diamond_transitive_contract; do
            nargo compile --package $pkg
            aztec test --package $pkg
          done

  compilation-failure-tests:
    name: Compilation Failure Tests
    runs-on: ubuntu-latest-m
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Aztec environment
        uses: defi-wonderland/aztec-ci-actions/actions/setup-aztec@v0
        with:
          start-pxe: "false"
          run-compile: "false"
          run-codegen: "false"

      - name: Run macro compilation failure tests
        run: ./macro_compilation_failure_tests/assert_macro_compilation_failure.sh
        env:
          NARGO: nargo

      - name: Run composition compilation failure tests
        run: ./composition_failure_tests/assert_composition_failure.sh
        env:
          NARGO: nargo
