name: Sync upstream tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to sync (e.g. v4.2.1)"
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tag
        run: |
          git remote add upstream https://github.com/AztecProtocol/aztec-nr
          git fetch upstream tag ${{ inputs.tag }} --no-tags

      - name: Create sync branch
        run: |
          git checkout -b sync/${{ inputs.tag }} ${{ inputs.tag }}
          git push origin sync/${{ inputs.tag }}

      - name: Open PR to dev
        run: |
          gh pr create \
            --base dev \
            --head sync/${{ inputs.tag }} \
            --title "chore: sync upstream ${{ inputs.tag }}" \
            --body "Upstream sync to \`${{ inputs.tag }}\`. Review macro conflicts before merging."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
